<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Vendas • Semijoias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="text-slate-800">

  <!-- DASHBOARD PRINCIPAL (Abre Direto) -->
  <div class="max-w-6xl mx-auto p-4 md:p-6 pb-24">
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2"><span>✨</span> Controle de Vendas</h1>
        <p class="text-sm text-slate-500">Sincronizado em tempo real com Google Sheets</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="carregarDados()" class="px-3 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl text-sm font-medium text-slate-700 transition">🔄 Atualizar</button>
        <button onclick="abrirModalNovaVenda()" class="px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-sm font-semibold shadow-sm transition">+ Nova Venda</button>
      </div>
    </header>

    <!-- Cards de KPI -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs font-medium text-slate-500 uppercase">Total Vendido</p>
        <p id="kpiTotal" class="text-xl md:text-2xl font-bold text-slate-900 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs font-medium text-emerald-600 uppercase">Já Recebido</p>
        <p id="kpiRecebido" class="text-xl md:text-2xl font-bold text-emerald-600 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs font-medium text-amber-600 uppercase">A Receber</p>
        <p id="kpiReceber" class="text-xl md:text-2xl font-bold text-amber-600 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs font-medium text-rose-600 uppercase">Em Atraso</p>
        <p id="kpiAtraso" class="text-xl md:text-2xl font-bold text-rose-600 mt-1">R$ 0,00</p>
      </div>
    </section>

    <!-- Tabela -->
    <section class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase">
              <th class="p-3.5">Garantia</th>
              <th class="p-3.5">Cliente</th>
              <th class="p-3.5">Produto</th>
              <th class="p-3.5">Valor</th>
              <th class="p-3.5">Entrada</th>
              <th class="p-3.5">Falta</th>
              <th class="p-3.5">Prazo</th>
              <th class="p-3.5">Situação</th>
              <th class="p-3.5 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaVendas" class="divide-y divide-slate-100 text-sm"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- MODAL -->
  <div id="modalVenda" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <h2 id="modalTitulo" class="text-lg font-bold text-slate-900 mb-4">Nova Venda</h2>
      <form onsubmit="salvarVenda(event)" class="space-y-4">
        <input type="hidden" id="editRowNumber" />
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-semibold">Cód. Garantia *</label><input type="text" id="campoGarantia" required class="w-full px-3 py-2 rounded-xl border text-sm" /></div>
          <div><label class="text-xs font-semibold">Data *</label><input type="date" id="campoData" required class="w-full px-3 py-2 rounded-xl border text-sm" /></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-semibold">Cliente *</label><input type="text" id="campoCliente" required class="w-full px-3 py-2 rounded-xl border text-sm" /></div>
          <div><label class="text-xs font-semibold">Vínculo</label>
            <select id="campoVinculo" class="w-full px-3 py-2 rounded-xl border text-sm bg-white">
              <option value="Trabalho">Trabalho</option><option value="Faculdade">Faculdade</option><option value="Família">Família</option><option value="Amigos">Amigos</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-semibold">Produto *</label><input type="text" id="campoProduto" required class="w-full px-3 py-2 rounded-xl border text-sm" /></div>
          <div><label class="text-xs font-semibold">Valor Total *</label><input type="number" step="0.01" id="campoValor" required class="w-full px-3 py-2 rounded-xl border text-sm" /></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-semibold">Forma Pagto</label>
            <select id="campoForma" class="w-full px-3 py-2 rounded-xl border text-sm bg-white">
              <option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option>
            </select>
          </div>
          <div><label class="text-xs font-semibold">Status</label>
            <select id="campoPagamento" class="w-full px-3 py-2 rounded-xl border text-sm bg-white">
              <option value="Pendente">Pendente</option><option value="OK">OK (Quitado)</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-semibold">Entrada</label><input type="number" step="0.01" id="campoEntrada" value="0" class="w-full px-3 py-2 rounded-xl border text-sm" /></div>
          <div><label class="text-xs font-semibold">Prazo</label><input type="date" id="campoPrazo" class="w-full px-3 py-2 rounded-xl border text-sm" /></div>
        </div>
        <div class="flex justify-end gap-2 pt-4 border-t">
          <button type="button" onclick="fecharModal()" class="px-4 py-2 border rounded-xl text-sm">Cancelar</button>
          <button type="submit" id="btnSalvar" class="px-5 py-2 bg-amber-600 text-white rounded-xl text-sm font-semibold">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // URL DO SEU GOOGLE APPS SCRIPT JÁ CONFIGURADA:
    const API_URL = "https://script.google.com/macros/s/AKfycbx8VQj1cRBNTYE10i9S5jQRYS36X6EZhfeWFyL_LHNyrSX_eGcrZfJZhJv7UnrEyqNh/exec
";

    let todasVendas = [];

    // Carrega os dados assim que a página abre
    carregarDados();

    async function carregarDados() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.status === "ok") {
          todasVendas = data.vendas;
          atualizarKPIs();
          renderizarTabela();
        }
      } catch (err) {
        console.error("Erro ao carregar:", err);
      }
    }

    function atualizarKPIs() {
      let total = 0, receber = 0, atraso = 0;
      todasVendas.forEach(v => {
        total += v.valor;
        receber += v.falta;
        if (v.situacao === "Atrasado") atraso += v.falta;
      });
      const recebido = total - receber;

      document.getElementById("kpiTotal").innerText = formatarMoeda(total);
      document.getElementById("kpiRecebido").innerText = formatarMoeda(recebido);
      document.getElementById("kpiReceber").innerText = formatarMoeda(receber);
      document.getElementById("kpiAtraso").innerText = formatarMoeda(atraso);
    }

    function renderizarTabela() {
      const tbody = document.getElementById("tabelaVendas");
      tbody.innerHTML = "";
      todasVendas.forEach(v => {
        let badgeClass = "bg-slate-100 text-slate-700";
        if (v.situacao === "Quitado") badgeClass = "bg-emerald-100 text-emerald-700";
        if (v.situacao === "Em dia") badgeClass = "bg-amber-100 text-amber-700";
        if (v.situacao === "Atrasado") badgeClass = "bg-rose-100 text-rose-700";

        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50";
        tr.innerHTML = `
          <td class="p-3.5 font-mono text-xs font-semibold">#${v.garantia}</td>
          <td class="p-3.5"><div class="font-semibold">${v.cliente}</div><div class="text-xs text-slate-400">${v.vinculo}</div></td>
          <td class="p-3.5">${v.produto}</td>
          <td class="p-3.5">${formatarMoeda(v.valor)}</td>
          <td class="p-3.5 text-emerald-600">${formatarMoeda(v.entrada)}</td>
          <td class="p-3.5 font-bold ${v.falta > 0 ? 'text-amber-600' : 'text-slate-400'}">${formatarMoeda(v.falta)}</td>
          <td class="p-3.5 text-xs text-slate-500">${v.prazo || '-'}</td>
          <td class="p-3.5"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">${v.situacao}</span></td>
          <td class="p-3.5 text-right"><button onclick='abrirModalEditar(${JSON.stringify(v)})' class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold">Editar</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function abrirModalNovaVenda() {
      document.getElementById("modalTitulo").innerText = "Nova Venda";
      document.getElementById("editRowNumber").value = "";
      document.getElementById("campoGarantia").value = "";
      document.getElementById("campoCliente").value = "";
      document.getElementById("campoProduto").value = "";
      document.getElementById("campoValor").value = "";
      document.getElementById("campoEntrada").value = "0";
      document.getElementById("campoPrazo").value = "";
      document.getElementById("campoData").value = new Date().toISOString().split("T")[0];
      document.getElementById("modalVenda").classList.remove("hidden");
      document.getElementById("modalVenda").classList.add("flex");
    }

    function abrirModalEditar(v) {
      document.getElementById("modalTitulo").innerText = "Editar Venda";
      document.getElementById("editRowNumber").value = v.rowNumber;
      document.getElementById("campoGarantia").value = v.garantia;
      document.getElementById("campoData").value = v.dataVenda;
      document.getElementById("campoCliente").value = v.cliente;
      document.getElementById("campoVinculo").value = v.vinculo;
      document.getElementById("campoProduto").value = v.produto;
      document.getElementById("campoValor").value = v.valor;
      document.getElementById("campoForma").value = v.formaPagamento;
      document.getElementById("campoPagamento").value = v.pagamento;
      document.getElementById("campoEntrada").value = v.entrada;
      document.getElementById("campoPrazo").value = v.prazo;
      document.getElementById("modalVenda").classList.remove("hidden");
      document.getElementById("modalVenda").classList.add("flex");
    }

    function fecharModal() {
      document.getElementById("modalVenda").classList.add("hidden");
      document.getElementById("modalVenda").classList.remove("flex");
    }

    async function salvarVenda(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSalvar");
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const rowNumber = document.getElementById("editRowNumber").value;
      const dados = {
        garantia: document.getElementById("campoGarantia").value,
        dataVenda: document.getElementById("campoData").value,
        cliente: document.getElementById("campoCliente").value,
        vinculo: document.getElementById("campoVinculo").value,
        produto: document.getElementById("campoProduto").value,
        valor: parseFloat(document.getElementById("campoValor").value) || 0,
        formaPagamento: document.getElementById("campoForma").value,
        pagamento: document.getElementById("campoPagamento").value,
        entrada: parseFloat(document.getElementById("campoEntrada").value) || 0,
        prazo: document.getElementById("campoPrazo").value
      };

      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: rowNumber ? "update" : "create", rowNumber, dados })
      });

      btn.innerText = "Salvar";
      btn.disabled = false;
      fecharModal();
      await carregarDados();
    }

    function formatarMoeda(val) {
      return Number(val || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }
  </script>
</body>
</html>
